# setup.cfg — tool configuration
# Project metadata and build config live in pyproject.toml.
# This file holds per-tool settings that read setup.cfg by convention.

[bdist_wheel]
universal = 0

[tool:pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test
python_functions = test_

[flake8]
max-line-length = 100
extend-ignore = E203, W503
exclude =
    .git,
    __pycache__,
    venv,
    build,
    dist,
    *.egg-info
