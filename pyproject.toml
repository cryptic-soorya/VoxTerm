[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "voxterm"
version = "1.0.0"
description = "Voice-controlled terminal assistant for macOS"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["voice", "terminal", "assistant", "whisper", "llm", "macos"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: MacOS",
    "Environment :: Console",
]

dependencies = [
    "pyaudio==0.2.14",
    "webrtcvad-wheels==2.0.14",
    "faster-whisper==1.2.1",
    "requests>=2.33.1",
    "google-genai>=1.0.0",
    "python-dotenv>=1.2.2",
    "rich>=14.3.3",
    "click>=8.3.1",
]

[project.optional-dependencies]
gui = [
    "rumps==0.4.0 ; sys_platform == 'darwin'",
]
hotkey = [
    "pynput==1.7.7 ; sys_platform == 'darwin'",
]
all = [
    "rumps==0.4.0 ; sys_platform == 'darwin'",
    "pynput==1.7.7 ; sys_platform == 'darwin'",
]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
voxterm = "voxterm.main:cli"

[project.urls]
Homepage = "https://github.com/cryptic-soorya/voxterm"
"Bug Tracker" = "https://github.com/cryptic-soorya/voxterm/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["voxterm*"]

[tool.setuptools.package-data]
voxterm = ["prompts/*.txt", "plugins/*.py", "plugins/*.md", "plugins/*.txt"]
